name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    id: problem
    attributes: { label: What happened?, description: Include the request state and expected result. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Flowless version }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Relevant redacted logs }
